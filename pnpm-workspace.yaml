packages:
  - "apps/*"
  - "packages/*"
  - "plugins/*"
  - "tools/*"
  - "website"

# ZCC deliberately ships Electron and native execution dependencies. Keep the
# allowlist narrow so pnpm's supply-chain policy continues to reject arbitrary
# lifecycle scripts while permitting the artifacts our existing build requires.
onlyBuiltDependencies:
  - "@google/genai"
  - "@julusian/jpeg-turbo"
  - "better-sqlite3"
  - "electron"
  - "electron-winstaller"
  - "esbuild"
  - "node-hid"
  - "node-pty"
  - "protobufjs"
  - "sharp"
  - "@parcel/watcher"
allowBuilds:
  '@google/genai': true
  '@julusian/jpeg-turbo': true
  '@parcel/watcher': true
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  node-hid: true
  node-pty: true
  protobufjs: true
  # Slack diagrams use an existing browser; installation must not download one.
  puppeteer: false
  sharp: true
blockExoticSubdeps: false
patchedDependencies:
  '@react-native-cookies/cookies@6.2.1': patches/@react-native-cookies__cookies@6.2.1.patch
  '@xterm/xterm@6.0.0': patches/@xterm__xterm@6.0.0.patch
  decode-uri-component@0.2.2: patches/decode-uri-component@0.2.2.patch

# Patched compatible releases for transitive editor and Expo tooling dependencies.
overrides:
  dompurify: 3.4.17
  '@earendil-works/pi-coding-agent>undici': 8.12.4
  'shell-quote@<1.11.0': 1.11.0
  'uuid@<11.1.1': 11.1.1
