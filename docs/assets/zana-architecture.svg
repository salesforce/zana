<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1390" viewBox="0 0 1440 1390" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">How Zana fits together</title>
  <desc id="desc">A logical view of the packaged desktop. The React UI, zcc CLI and Control SDK, and agent tools submit intent to trusted product services. The product server owns policy, projects, durable state, and full-trust installed plugins. Electron owns native integration, runtime supervision, and IPC and MCP adapters. Threads run through signed host commands, the host daemon, agent runtime, and provider bridges. CLI Agents still launch through desktop compatibility adapters into host harness modules and real PTYs. Events and replies return to product services. Zana supports local projects, enrolled machines, and SSH projects.</desc>
  <!-- Logical responsibilities, not a promise that all execution already crosses host RPC.
       In particular, CLI Agents retain the Electron compatibility launch path.
       Sources and export instructions: docs/assets/README.md. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="1390" gradientUnits="userSpaceOnUse"><stop stop-color="#172641"/><stop offset=".45" stop-color="#101c33"/><stop offset="1" stop-color="#0d152b"/></linearGradient>
    <linearGradient id="accent" x1="64" y1="171" x2="1376" y2="171" gradientUnits="userSpaceOnUse"><stop stop-color="#93dfff"/><stop offset=".6" stop-color="#c0b9ff"/><stop offset="1" stop-color="#ffdb9e"/></linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" stroke="#93dfff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="gold-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" stroke="#ffdb9e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1440" height="1390" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1438" height="1388" rx="27" stroke="#34496b"/>
  <path d="M64 171H1376" stroke="url(#accent)" stroke-opacity=".55"/>
