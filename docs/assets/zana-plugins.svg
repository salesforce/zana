    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(495 436) rotate(90) scale(474 427)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#537ccf" stop-opacity=".42"/>
      <stop offset="1" stop-color="#537ccf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="272" y1="64" x2="711" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b8dbff" stop-opacity=".52"/>
      <stop offset=".5" stop-color="#8ea8ee" stop-opacity=".05"/>
      <stop offset="1" stop-color="#8ea8ee" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="left-wing" x1="229" y1="290" x2="462" y2="617" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e0fcff"/>
      <stop offset=".44" stop-color="#93dfff"/>
      <stop offset="1" stop-color="#5e8df5"/>
    </linearGradient>
    <linearGradient id="right-wing" x1="750" y1="295" x2="576" y2="595" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eee9ff"/>
      <stop offset=".5" stop-color="#c0b9ff"/>
      <stop offset="1" stop-color="#7389ee"/>
    </linearGradient>
    <linearGradient id="lower-wing" x1="344" y1="533" x2="659" y2="741" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79cafa"/>
      <stop offset="1" stop-color="#887cd7"/>
    </linearGradient>
    <linearGradient id="fairy" x1="472" y1="327" x2="576" y2="770" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset=".58" stop-color="#e9f6ff"/>
      <stop offset="1" stop-color="#b3ccf5"/>
    </linearGradient>
    <linearGradient id="spark" x1="732" y1="198" x2="779" y2="321" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff7d6"/>
      <stop offset="1" stop-color="#ffc878"/>
