    <filter id="shadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="spark-glow" x="655" y="145" width="215" height="230" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- Inset tile, with transparent margins for the macOS Dock. -->
  <rect x="66" y="81" width="892" height="892" rx="200" fill="#040c1c" opacity=".28" filter="url(#shadow)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#aura)"/>
  <rect x="66" y="66" width="892" height="892" rx="198" stroke="url(#edge)" stroke-width="3"/>

  <!-- Broad wings remain legible when the constellation details disappear. -->
  <path d="M459 561C344 555 234 473 229 291C355 310 437 392 459 561Z" fill="url(#left-wing)"/>
  <path d="M567 561C681 547 762 448 750 294C638 330 577 419 567 561Z" fill="url(#right-wing)"/>
  <path d="M450 584C348 545 276 578 267 704C357 717 420 669 450 584Z" fill="url(#lower-wing)"/>
  <path d="M575 584C677 547 748 579 757 702C668 717 605 670 575 584Z" fill="url(#lower-wing)"/>
  <path d="M252 315C279 409 340 476 417 516M727 321C704 407 657 474 610 516" stroke="#fff" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#254f94" stroke-opacity=".27" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M304 379L333 445L397 481"/>
    <path d="M333 445L328 488"/>
    <path d="M686 385L660 447L623 472"/>
  </g>
  <g fill="#edfaff">
    <circle cx="304" cy="379" r="7"/>
    <circle cx="333" cy="445" r="7"/>
    <circle cx="328" cy="488" r="7"/>
    <circle cx="686" cy="385" r="7"/>
    <circle cx="660" cy="447" r="7"/>
  </g>

  <!-- A floating head and flowing dress form the fairy silhouette. -->
  <circle cx="512" cy="367" r="47" fill="url(#fairy)"/>
  <path d="M512 446C539 479 546 523 551 566C558 632 592 689 625 723C554 762 472 762 399 723C436 680 466 627 473 566C478 523 485 479 512 446Z" fill="url(#fairy)"/>
  <path d="M518 474C563 510 601 502 639 460" stroke="#f2f7ff" stroke-width="21" stroke-linecap="round"/>
  <path d="M630 470L726 325" stroke="#f5d59c" stroke-width="13" stroke-linecap="round"/>

  <!-- A single warm spark is the focal point. -->
  <path d="M758 203C765 245 777 258 816 267C777 276 765 289 758 331C749 289 737 276 698 267C737 258 749 245 758 203Z" fill="#ffd48d" opacity=".55" filter="url(#spark-glow)"/>
  <path d="M758 203C765 245 777 258 816 267C777 276 765 289 758 331C749 289 737 276 698 267C737 258 749 245 758 203Z" fill="url(#spark)"/>
  <circle cx="682" cy="224" r="7" fill="#fff0d1" opacity=".8"/>
  <circle cx="820" cy="342" r="5" fill="#d3ddff" opacity=".65"/>
</svg>

  <g font-family="Arial, Helvetica, sans-serif">
  <text x="64" y="62" font-size="17" fill="#ffdb9e" font-weight="700" letter-spacing="2">ZANA / PLUGINS</text>
  <text x="64" y="117" font-size="44" fill="#f0f7ff" font-weight="700" letter-spacing="-1">One package. Many possibilities.</text>
  <text x="64" y="150" font-size="22" fill="#b6c9e0" font-weight="400" >Add new views, new tools, and new workflows to your command center.</text>
  <text x="64" y="212" font-size="17" fill="#93dfff" font-weight="700" letter-spacing="2">01 / CHOOSE &amp; INSTALL</text>
  <rect x="64" y="236" width="578" height="121" rx="20" fill="#14223c" stroke="#2c4366"/>
  <text x="90" y="275" font-size="28" fill="#f0f7ff" font-weight="700" >Find or create a plugin</text>
  <text x="90" y="310" font-size="23" fill="#b6c9e0" font-weight="400" >Marketplace · npm · Git · builtin · local</text>
  <text x="90" y="339" font-size="20" fill="#b6c9e0" font-weight="400" >Browse a catalog, or bring your own package.</text>
  <path d="M657 296H778" stroke="#93dfff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="796" y="236" width="580" height="121" rx="20" fill="#20283e" stroke="#70644f"/>
  <text x="822" y="275" font-size="28" fill="#f0f7ff" font-weight="700" >Install &amp; enable</text>
  <text x="822" y="310" font-size="22" fill="#b6c9e0" font-weight="400" >PluginService validates and loads the package.</text>
  <text x="822" y="339" font-size="20" fill="#ffdb9e" font-weight="400" >Install / enable is the trust decision.</text>
  <path d="M1086 357V391H720V427" stroke="#93dfff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="64" y="404" font-size="17" fill="#c0b9ff" font-weight="700" letter-spacing="2">02 / DECLARE CONTRIBUTIONS</text>
  <rect x="64" y="438" width="1312" height="136" rx="20" fill="#192b46" stroke="#52658b"/>
  <text x="90" y="478" font-size="29" fill="#f0f7ff" font-weight="700" >package.json → zcc</text>
  <text x="1350" y="478" font-size="22" fill="#b6c9e0" font-weight="400" text-anchor="end">Choose the contributions you need.</text>
  <rect x="90" y="502" width="290" height="47" rx="10" fill="#132139" stroke="#3a506f"/>
  <text x="108" y="533" font-size="22" fill="#93dfff" font-weight="600" font-family="Menlo, Consolas, monospace">server</text>
  <rect x="409" y="502" width="290" height="47" rx="10" fill="#132139" stroke="#3a506f"/>
  <text x="427" y="533" font-size="22" fill="#c0b9ff" font-weight="600" font-family="Menlo, Consolas, monospace">app</text>
  <rect x="728" y="502" width="290" height="47" rx="10" fill="#132139" stroke="#3a506f"/>
  <text x="746" y="533" font-size="22" fill="#c0b9ff" font-weight="600" font-family="Menlo, Consolas, monospace">skills</text>
  <rect x="1047" y="502" width="303" height="47" rx="10" fill="#132139" stroke="#3a506f"/>
  <text x="1065" y="533" font-size="22" fill="#ffdb9e" font-weight="600" font-family="Menlo, Consolas, monospace">mcpServers</text>
  <path d="M720 574V601H362V634" stroke="#93dfff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M720 601H1078V634" stroke="#93dfff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="64" y="648" width="596" height="286" rx="20" fill="#142a43" stroke="#457e9c"/>
  <text x="90" y="688" font-size="17" fill="#93dfff" font-weight="700" letter-spacing="2">03 / SERVER · zcc.server</text>
  <text x="90" y="733" font-size="32" fill="#f0f7ff" font-weight="700" >Trusted logic</text>
  <text x="90" y="775" font-size="24" fill="#bcefff" font-weight="600" font-family="Menlo, Consolas, monospace">ZccPluginApi</text>
  <text x="90" y="820" font-size="23" fill="#b6c9e0" font-weight="400" >RPC · storage · settings · CLI</text>
  <text x="90" y="858" font-size="23" fill="#b6c9e0" font-weight="400" >Tools · events · background jobs</text>
  <path d="M90 880H634" stroke="#375773" stroke-width="2" fill="none" />
  <text x="90" y="913" font-size="22" fill="#d0dcf0" font-weight="400" >Full-trust code in the product server.</text>
  <rect x="780" y="648" width="596" height="286" rx="20" fill="#1e2541" stroke="#6b6596"/>
  <text x="806" y="688" font-size="17" fill="#c0b9ff" font-weight="700" letter-spacing="2">03 / APP · zcc.app</text>
  <text x="806" y="733" font-size="32" fill="#f0f7ff" font-weight="700" >Integrated UI</text>
  <text x="806" y="775" font-size="24" fill="#ded9ff" font-weight="600" font-family="Menlo, Consolas, monospace">definePluginApp</text>
  <text x="806" y="820" font-size="23" fill="#b6c9e0" font-weight="400" >Panels · project tabs · settings</text>
  <text x="806" y="858" font-size="23" fill="#b6c9e0" font-weight="400" >Composer · thread contributions</text>
  <path d="M806 880H1350" stroke="#514d70" stroke-width="2" fill="none" />
  <text x="806" y="913" font-size="22" fill="#d0dcf0" font-weight="400" >Mounts in the React interface.</text>
  <text x="720" y="769" font-size="19" fill="#93dfff" font-weight="600" text-anchor="middle">RPC</text>
  <path d="M768 790H672" stroke="#93dfff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="720" y="831" font-size="18" fill="#c0b9ff" font-weight="600" text-anchor="middle">Events</text>
  <path d="M672 850H768" stroke="#c0b9ff" stroke-width="2" fill="none" stroke-dasharray="4 6" marker-end="url(#event-arrow)"/>
  <text x="64" y="992" font-size="17" fill="#c0b9ff" font-weight="700" letter-spacing="2">04 / EQUIP YOUR AGENTS</text>
  <rect x="64" y="1016" width="420" height="202" rx="20" fill="#14223c" stroke="#2c4366"/>
  <text x="88" y="1060" font-size="28" fill="#f0f7ff" font-weight="700" >Skills</text>
  <text x="88" y="1103" font-size="21" fill="#c0b9ff" font-weight="600" font-family="Menlo, Consolas, monospace">zcc.skills</text>
  <text x="88" y="1150" font-size="21" fill="#b6c9e0" font-weight="400" >Reusable instructions.</text>
  <text x="88" y="1185" font-size="21" fill="#b6c9e0" font-weight="400" >skills/&lt;name&gt;/SKILL.md</text>
  <rect x="510" y="1016" width="420" height="202" rx="20" fill="#14223c" stroke="#2c4366"/>
  <text x="534" y="1060" font-size="28" fill="#f0f7ff" font-weight="700" >Thread tools</text>
  <text x="534" y="1103" font-size="21" fill="#93dfff" font-weight="600" font-family="Menlo, Consolas, monospace">agents.registerTool</text>
  <text x="534" y="1150" font-size="21" fill="#b6c9e0" font-weight="400" >Registered by server code.</text>
  <text x="534" y="1185" font-size="21" fill="#b6c9e0" font-weight="400" >Available to conversation Threads.</text>
  <rect x="956" y="1016" width="420" height="202" rx="20" fill="#14223c" stroke="#2c4366"/>
  <text x="980" y="1060" font-size="28" fill="#f0f7ff" font-weight="700" >CLI Agent MCP</text>
  <text x="980" y="1103" font-size="21" fill="#ffdb9e" font-weight="600" font-family="Menlo, Consolas, monospace">zcc.mcpServers</text>
  <text x="980" y="1150" font-size="21" fill="#b6c9e0" font-weight="400" >Declared in the manifest.</text>
  <text x="980" y="1185" font-size="21" fill="#b6c9e0" font-weight="400" >Configured for supported CLIs.</text>
  <text x="64" y="1259" font-size="22" fill="#b6c9e0" font-weight="400" >Skills and MCP are declared in the manifest. Thread tools are registered at runtime.</text>
  <rect x="64" y="1303" width="1312" height="133" rx="18" fill="#1b263a" stroke="#6c604d"/>
  <text x="90" y="1341" font-size="17" fill="#ffdb9e" font-weight="700" letter-spacing="2">THE DEVELOPMENT LOOP</text>
  <text x="90" y="1384" font-size="30" fill="#f0f7ff" font-weight="700" >Edit → build → reload</text>
  <text x="1350" y="1341" font-size="23" fill="#ffdb9e" font-weight="600" text-anchor="end" font-family="Menlo, Consolas, monospace">zcc plugin dev</text>
  <text x="1350" y="1384" font-size="22" fill="#b6c9e0" font-weight="400" text-anchor="end">Watch source, rebuild, and refresh the installed plugin.</text>
  <text x="90" y="1415" font-size="21" fill="#b6c9e0" font-weight="400" >Use onDispose to release plugin-owned timers and subscriptions.</text>
  <text x="64" y="1471" font-size="20" fill="#c0cde0" font-weight="400" >Optional contributions. One consistent Zana experience.</text>
  <text x="1376" y="1471" font-size="20" fill="#c0cde0" font-weight="400" text-anchor="end">@zana-ai/zcc-plugin-sdk</text>
  </g>
</svg>
