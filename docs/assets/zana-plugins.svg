<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1500" viewBox="0 0 1440 1500" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">How Zana plugins work — from package to product</title>
  <desc id="desc">Choose a package from the marketplace, npm, Git, builtins, or a local folder. PluginService validates and loads the installed package. The package.json zcc block declares optional server, app, skills, and MCP contributions. Server code runs full-trust inside the product server using ZccPluginApi. App code registers React interface slots with definePluginApp. The app calls server methods over RPC and receives events. Skills supply instructions, server-registered tools extend Threads, and manifest-declared MCP servers integrate with supported CLI Agents. zcc plugin dev rebuilds and reloads local changes; onDispose cleans up plugin-owned resources.</desc>
  <!-- Common plugin contributions; specialized host/provider bridges are outside this view.
       Source references and PNG export instructions: docs/assets/README.md. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="1500" gradientUnits="userSpaceOnUse"><stop stop-color="#172641"/><stop offset=".45" stop-color="#101c33"/><stop offset="1" stop-color="#0d152b"/></linearGradient>
    <linearGradient id="accent" x1="64" y1="171" x2="1376" y2="171" gradientUnits="userSpaceOnUse"><stop stop-color="#93dfff"/><stop offset=".6" stop-color="#c0b9ff"/><stop offset="1" stop-color="#ffdb9e"/></linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" stroke="#93dfff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="event-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" stroke="#c0b9ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1440" height="1500" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1438" height="1498" rx="27" stroke="#34496b"/>
  <path d="M64 171H1376" stroke="url(#accent)" stroke-opacity=".55"/>
  <svg xmlns="http://www.w3.org/2000/svg" x="1270" y="35" width="110" height="110" viewBox="0 0 1024 1024" fill="none">
