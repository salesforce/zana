<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg-base:#0b0f15; --bg-panel:#10151c; --bg-elevated:#161c25; --bg-hover:#1a212c;
    --border:#1f2731; --border-strong:#2a3340;
    --text-bright:#e6edf3; --text-muted:#8b949e; --text-dim:#6e7681;
    --accent-gold:#d4a017; --accent-blue:#2f81f7; --danger:#f85149; --success:#3fb950;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg-base)}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text-bright);width:1200px;font-size:13px;-webkit-font-smoothing:antialiased}
  .shell{width:1200px;background:var(--bg-base)}
  .topbar{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--bg-panel)}
  .topbar h1{font-size:14px;font-weight:600}
  .topbar .sub{color:var(--text-dim);font-size:12px}
  .spacer{flex:1}
  .toggle{display:inline-flex;background:var(--bg-elevated);border:1px solid var(--border);border-radius:7px;padding:2px;gap:2px}
  .toggle button{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:none;border-radius:5px;background:transparent;color:var(--text-muted);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit}
  .toggle button.active{background:var(--bg-hover);color:var(--text-bright);box-shadow:0 0 0 1px var(--border-strong)}
  .toggle svg{width:14px;height:14px}
  .canvas{position:relative;margin:18px 24px;height:520px;background:radial-gradient(circle at 1px 1px, rgba(255,255,255,.035) 1px, transparent 0);background-size:22px 22px;border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center}
  .empty{text-align:center;max-width:420px}
  .empty .ico{width:64px;height:64px;margin:0 auto 18px;border-radius:16px;background:var(--bg-elevated);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center}
  .empty .ico svg{width:30px;height:30px;color:var(--text-dim)}
  .empty h2{font-size:16px;font-weight:600;margin-bottom:8px}
  .empty p{color:var(--text-muted);font-size:13px;line-height:1.6}
  .empty code{background:var(--bg-elevated);border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--accent-gold);font-size:12px}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <h1>Agents</h1>
    <span class="sub">· zana-command-center</span>
    <div class="spacer"></div>
    <div class="toggle">
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="10" rx="1"/></svg>Board</button>
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1.5"/><circle cx="3.5" cy="12" r="1.5"/><circle cx="3.5" cy="18" r="1.5"/></svg>List</button>
      <button class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="12" r="3"/><path d="M9 6h6a3 3 0 0 1 3 3v0M9 18h6a3 3 0 0 0 3-3v0"/></svg>Flow</button>
    </div>
  </div>
  <div class="canvas">
    <div class="empty">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="12" r="3"/><path d="M9 6h6a3 3 0 0 1 3 3v0M9 18h6a3 3 0 0 0 3-3v0"/></svg></div>
      <h2>No squads running</h2>
      <p>When you launch a team with <code>/zana:team</code>, its members appear here as a live flow — who's working, who's blocked, and how work hands off between them.</p>
    </div>
  </div>
</div>
</body>
</html>
