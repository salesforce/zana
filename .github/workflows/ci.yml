name: CI

# Gate every change that targets main: typecheck + unit tests must pass before
# a PR can merge. release.yml re-runs the same gate on tag pushes, but this is
# the one wired into branch protection (a required status check on main).

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Manual trigger also runs the same required verification jobs.
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Optional comparison base for the full unpublished branch range'
        required: false
        type: string

# A new push to a PR cancels the previous run for that PR — no point burning
# minutes on a commit that's already superseded. main pushes use the ref so they
# don't cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Plan with Node built-ins before provisioning any Electron runner.
  plan:
    name: Select production-boundary checks
    runs-on: ubuntu-latest
    outputs:
      preview: ${{ steps.plan.outputs.preview }}
      e2e: ${{ steps.plan.outputs.e2e }}
      e2e_matrix: ${{ steps.plan.outputs.e2e_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: plan
        run: node scripts/ci-plan.mjs
        env:
          CI_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          CI_FORCE_PREVIEW: ${{ github.event_name == 'workflow_dispatch' }}

  # The root suite runs pure unit files in parallel, then files that spawn real
  # bridges, shells and PTYs one at a time (vitest.serial.ts). Each shard is its
  # own VM, so that split holds within every shard.
  unit:
    name: Unit tests (shard ${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Coverage locations must match PR-head source lines. The E2E job
          # below stays on GitHub's synthetic merge to validate integration.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # node-pty / better-sqlite3 are native; pnpm runs their install
      # scripts. distutils was dropped from Python 3.12 stdlib, so pin 3.11
      # where node-gyp can still import it (matches release.yml).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The diagram tests exercise the same local asset shipped in the plugin.
      # A clean unit-test checkout has not run the production plugin build.
      - name: Prepare Slack runtime assets
        run: pnpm --filter zcc-plugin-slack-bridge-2ff2 package

      - name: Install Chrome for Slack diagram tests
        run: pnpm --dir plugins/slack-bridge-2ff2 exec puppeteer browsers install chrome

      # The real Chromium diagram test needs the same sandbox support as Electron.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Unit tests with coverage
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/5 --coverage --coverage.reportOnFailure --coverage.reporter=json --coverage.reportsDirectory=coverage/root-${{ matrix.shard }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage-root-${{ matrix.shard }}
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  unit-packages:
    name: Typecheck and package unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Coverage locations must match PR-head source lines. The E2E job
          # below stays on GitHub's synthetic merge to validate integration.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # node-pty / better-sqlite3 are native; pnpm runs their install
      # scripts. distutils was dropped from Python 3.12 stdlib, so pin 3.11
      # where node-gyp can still import it (matches release.yml).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # The public feed is served live from main, so a merged entry must be
      # schema-valid and its committed catalogs regenerated.
      - name: Marketplace catalog check
        run: |
          node marketplace/scripts/build.mjs --check
          npm test --prefix marketplace

      - name: Tasks tests with package configuration and coverage
        run: pnpm exec vitest run --config plugins/tasks/vitest.config.ts --coverage --coverage.reportOnFailure --coverage.reporter=json --coverage.reportsDirectory="$GITHUB_WORKSPACE/coverage/tasks"

      - name: Pi provider tests with package configuration and coverage
        run: pnpm --dir plugins/provider-pi exec vitest run --config vitest.config.ts --coverage --coverage.reportOnFailure --coverage.reporter=json --coverage.reportsDirectory="$GITHUB_WORKSPACE/coverage/pi"

      # build-plugin-server.test.ts bundles from the SDK's built dist. The old
      # single job built it as a side effect of earlier steps; do it explicitly.
      - name: Build plugin SDK runtime
        run: pnpm --filter @zana-ai/zcc-plugin-sdk build

      - name: Release package coverage
        run: pnpm exec vitest run --config vitest.release-coverage.config.ts --coverage --coverage.reportOnFailure --coverage.reporter=json --coverage.reportsDirectory=coverage/release

      # Coverage overhead exceeds the production worker's fixed heap/fence
      # budgets, so its full-size rewrite regression runs without instrumentation.
      - name: Large document worker fence without coverage
        run: pnpm exec vitest run apps/server/src/plugins/isolated-plugin-runtime.test.ts -t 'applies and rewrites supported 24MiB' --reporter=verbose

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage-packages
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # Merge every shard's coverage before applying the changed-code floor:
  # scripts/ci-verification.mjs sums hit counts per location across reports.
  # Production Connect runs on Postgres (advisory locks, concurrent claims);
  # the root suite only covers SQLite, so these files skip there.
  connect-postgres:
    name: Connect on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: connect
          POSTGRES_DB: connect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Connect Postgres tests
        env:
          ZCC_CONNECT_TEST_DATABASE_URL: postgres://postgres:connect@127.0.0.1:5432/connect
        run: pnpm exec vitest run website/connect/postgres.test.ts website/connect/machines.postgres.test.ts

  coverage:
    name: Changed-code coverage
    runs-on: ubuntu-latest
    needs: [unit, unit-packages]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Coverage locations must match PR-head source lines. The E2E job
          # below stays on GitHub's synthetic merge to validate integration.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download coverage reports
        uses: actions/download-artifact@v7
        with:
          pattern: unit-coverage-*
          path: coverage
          merge-multiple: true

      - name: Enforce changed-code coverage
        run: node scripts/ci-verification.mjs --coverage coverage/root-1/coverage-final.json coverage/root-2/coverage-final.json coverage/root-3/coverage-final.json coverage/root-4/coverage-final.json coverage/root-5/coverage-final.json coverage/tasks/coverage-final.json coverage/pi/coverage-final.json coverage/release/coverage-final.json
        env:
          CI_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  # One immutable Linux build feeds private per-shard runtime snapshots.
  e2e-build:
    name: Build Electron test artifact
    needs: plan
    if: needs.plan.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/electron-cache
      - name: Build production Electron runtime
        run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      # Browser images supply runtime libraries, not a C++ compiler. Prepare the
      # verified ABI cache on the build runner without replacing Node's addon.
      - name: Prepare Electron native ABI cache
        run: pnpm run rebuild:electron
      - name: Archive runtime and generated plugin assets
        run: >-
          tar --exclude='plugins/*/node_modules' --exclude='*/.git'
          -czf "$RUNNER_TEMP/electron-e2e-build.tgz"
          out plugins resources packages/cli/dist packages/plugin-sdk/dist apps/host-daemon/dist
          node_modules/.cache/zcc-native-abi
      - uses: actions/upload-artifact@v7
        with:
          name: electron-e2e-build
          path: ${{ runner.temp }}/electron-e2e-build.tgz
          overwrite: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # Every affected seam is exercised in the built app; failures fail CI.
  # Keep model-spending live attach suites outside unattended CI.
  e2e:
    name: Affected Electron boundaries (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Match the lockfile's Playwright version and the build runner's Ubuntu 26.04.
    # The immutable image supplies WebKit libraries absent from hosted runners.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-resolute@sha256:b022639ae9197f864040f92eef7b57c6d4b47db2190f77c909d8a5d902dd4b7e
      options: --ipc=host
    needs: [plan, e2e-build]
    if: needs.plan.outputs.e2e == 'true'
    # Pack whole spec files by measured duration; empty shards never provision.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.e2e_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The mounted workspace belongs to the host runner, not container root.
      # Trust only this checkout so Git can select the affected boundaries.
      - name: Trust checked-out repository in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install tmux for native PTY coverage
        run: apt-get update && apt-get install -y --no-install-recommends tmux

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/electron-cache

      - uses: actions/download-artifact@v7
        with:
          name: electron-e2e-build
          path: ${{ runner.temp }}

      - name: Restore the same-run Electron build
        run: tar -xzf "$RUNNER_TEMP/electron-e2e-build.tgz"

      # Browsers and their libraries are supplied together by the pinned image.
      # Electron still validates its own binary before the real app tests.
      - name: Check system deps for headless Electron
        run: node scripts/check-electron-linux-deps.mjs

      - name: Test affected Electron boundaries from private snapshots
        run: xvfb-run -a node scripts/ci-verification.mjs
        env:
          CI_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          NODE_OPTIONS: --max-old-space-size=6144
          CI_E2E_SHARD: ${{ matrix.shard }}/3
          CI_E2E_PREBUILT: '1'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            e2e/.artifacts
          retention-days: 7
          if-no-files-found: ignore

  # File URL parsing and preview path confinement cross OS boundaries. Keep a
  # focused built-Electron regression on every supported desktop/runtime OS.
  preview-cross-platform:
    needs: plan
    if: needs.plan.outputs.preview == 'true'
    name: File preview (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/electron-cache

      - name: Check Linux Electron display dependencies
        if: runner.os == 'Linux'
        run: |
          node scripts/check-electron-linux-deps.mjs
          pnpm exec playwright install chromium
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run file preview production-boundary regression
        if: runner.os != 'Linux'
        run: pnpm test:e2e -- e2e/thread-file-preview-ambiguity.spec.ts e2e/thread-file-preview-links.spec.ts

      - name: Run file preview production-boundary regression on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:e2e -- e2e/thread-file-preview-ambiguity.spec.ts e2e/thread-file-preview-links.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: file-preview-${{ matrix.os }}
          path: |
            playwright-report
            e2e/.artifacts
          retention-days: 7
          if-no-files-found: ignore

  # Native Windows admission must reject unsupported named checks before spawn.
  # Build on Windows: Linux Electron artifacts/native addons cannot be reused.
  squad-windows-admission:
    name: Squad Windows admission
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Windows dependencies
        run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/electron-cache
      - name: Verify runner rejection before process allocation
        run: pnpm exec vitest run apps/server/src/services/execution/__tests__/named-check-runner.test.ts
      - name: Verify native Windows Squad admission
        run: pnpm test:e2e -- e2e/windows-squad-named-check-admission.spec.ts
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Upload Windows admission failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: squad-windows-admission
          path: |
            playwright-report
            e2e/.artifacts
          retention-days: 7
          if-no-files-found: ignore

  # Preserve the existing required check name while making every job load-bearing.
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    needs: [plan, unit, unit-packages, coverage, e2e-build, e2e, preview-cross-platform, connect-postgres, squad-windows-admission]
    if: always()
    steps:
      - name: Require unit and production-boundary verification
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          E2E_REQUIRED: ${{ needs.plan.outputs.e2e }}
          PREVIEW_REQUIRED: ${{ needs.plan.outputs.preview }}
          UNIT_RESULT: ${{ needs.unit.result }}
          PACKAGES_RESULT: ${{ needs.unit-packages.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          BUILD_RESULT: ${{ needs.e2e-build.result }}
          BOUNDARY_RESULT: ${{ needs.e2e.result }}
          PREVIEW_MATRIX_RESULT: ${{ needs.preview-cross-platform.result }}
          POSTGRES_RESULT: ${{ needs.connect-postgres.result }}
          WINDOWS_ADMISSION_RESULT: ${{ needs.squad-windows-admission.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$PACKAGES_RESULT" = success
          test "$COVERAGE_RESULT" = success
          if [ "$E2E_REQUIRED" = true ]; then
            test "$BUILD_RESULT" = success
            test "$BOUNDARY_RESULT" = success
          else
            test "$E2E_REQUIRED" = false
            test "$BUILD_RESULT" = skipped
            test "$BOUNDARY_RESULT" = skipped
          fi
          if [ "$PREVIEW_REQUIRED" = true ]; then
            test "$PREVIEW_MATRIX_RESULT" = success
          else
            test "$PREVIEW_REQUIRED" = false
            test "$PREVIEW_MATRIX_RESULT" = skipped
          fi
          test "$POSTGRES_RESULT" = success
          test "$WINDOWS_ADMISSION_RESULT" = success
