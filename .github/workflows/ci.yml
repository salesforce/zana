name: CI

# Gate every change that targets main: typecheck + unit tests must pass before
# a PR can merge. release.yml re-runs the same gate on tag pushes, but this is
# the one wired into branch protection (a required status check on main).

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Manual trigger also runs the same required verification jobs.
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Optional comparison base for the full unpublished branch range'
        required: false
        type: string

# A new push to a PR cancels the previous run for that PR — no point burning
# minutes on a commit that's already superseded. main pushes use the ref so they
# don't cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The root suite runs pure unit files in parallel, then files that spawn real
  # bridges, shells and PTYs one at a time (vitest.serial.ts). Each shard is its
  # own VM, so that split holds within every shard.
  unit:
    name: Unit tests (shard ${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Coverage locations must match PR-head source lines. The E2E job
          # below stays on GitHub's synthetic merge to validate integration.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # node-pty / better-sqlite3 are native; pnpm runs their install
      # scripts. distutils was dropped from Python 3.12 stdlib, so pin 3.11
      # where node-gyp can still import it (matches release.yml).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The diagram tests exercise the same local asset shipped in the plugin.
      # A clean unit-test checkout has not run the production plugin build.
      - name: Prepare Slack runtime assets
        run: pnpm --filter zcc-plugin-slack-bridge-2ff2 package

      - name: Install Chrome for Slack diagram tests
        run: pnpm --dir plugins/slack-bridge-2ff2 exec puppeteer browsers install chrome

      # The real Chromium diagram test needs the same sandbox support as Electron.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Unit tests with coverage
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/5 --coverage --coverage.reportOnFailure --coverage.reporter=json --coverage.reportsDirectory=coverage/root-${{ matrix.shard }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage-root-${{ matrix.shard }}
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  unit-packages:
    name: Typecheck and package unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Coverage locations must match PR-head source lines. The E2E job
          # below stays on GitHub's synthetic merge to validate integration.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # node-pty / better-sqlite3 are native; pnpm runs their install
      # scripts. distutils was dropped from Python 3.12 stdlib, so pin 3.11
      # where node-gyp can still import it (matches release.yml).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # The public feed is served live from main, so a merged entry must be
      # schema-valid and its committed catalogs regenerated.
      - name: Marketplace catalog check
        run: |
          node marketplace/scripts/build.mjs --check
          npm test --prefix marketplace

      - name: Tasks tests with package configuration and coverage
        run: pnpm exec vitest run --config plugins/tasks/vitest.config.ts --coverage --coverage.reportOnFailure --coverage.reporter=json --coverage.reportsDirectory="$GITHUB_WORKSPACE/coverage/tasks"

      - name: Pi provider tests with package configuration and coverage
        run: pnpm --dir plugins/provider-pi exec vitest run --config vitest.config.ts --coverage --coverage.reportOnFailure --coverage.reporter=json --coverage.reportsDirectory="$GITHUB_WORKSPACE/coverage/pi"

      # build-plugin-server.test.ts bundles from the SDK's built dist. The old
      # single job built it as a side effect of earlier steps; do it explicitly.
      - name: Build plugin SDK runtime
        run: pnpm --filter @zana-ai/zcc-plugin-sdk build

      - name: Release package coverage
        run: pnpm exec vitest run --config vitest.release-coverage.config.ts --coverage --coverage.reportOnFailure --coverage.reporter=json --coverage.reportsDirectory=coverage/release

      # Coverage overhead exceeds the production worker's fixed heap/fence
      # budgets, so its full-size rewrite regression runs without instrumentation.
      - name: Large document worker fence without coverage
        run: pnpm exec vitest run apps/server/src/plugins/isolated-plugin-runtime.test.ts -t 'applies and rewrites supported 24MiB' --reporter=verbose

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage-packages
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # Merge every shard's coverage before applying the changed-code floor:
  # scripts/ci-verification.mjs sums hit counts per location across reports.
  # Production Connect runs on Postgres (advisory locks, concurrent claims);
  # the root suite only covers SQLite, so these files skip there.
  connect-postgres:
    name: Connect on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: connect
          POSTGRES_DB: connect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Connect Postgres tests
        env:
          ZCC_CONNECT_TEST_DATABASE_URL: postgres://postgres:connect@127.0.0.1:5432/connect
        run: pnpm exec vitest run website/connect/postgres.test.ts website/connect/machines.postgres.test.ts

  coverage:
    name: Changed-code coverage
    runs-on: ubuntu-latest
    needs: [unit, unit-packages]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Coverage locations must match PR-head source lines. The E2E job
          # below stays on GitHub's synthetic merge to validate integration.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download coverage reports
        uses: actions/download-artifact@v7
        with:
          pattern: unit-coverage-*
          path: coverage
          merge-multiple: true

      - name: Enforce changed-code coverage
        run: node scripts/ci-verification.mjs --coverage coverage/root-1/coverage-final.json coverage/root-2/coverage-final.json coverage/root-3/coverage-final.json coverage/root-4/coverage-final.json coverage/root-5/coverage-final.json coverage/tasks/coverage-final.json coverage/pi/coverage-final.json coverage/release/coverage-final.json
        env:
          CI_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  # Every affected seam is exercised in the built app; failures fail CI.
  # Keep model-spending live attach suites outside unattended CI.
  e2e:
    name: Affected Electron boundaries (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Broad branches select 94 serial production-boundary cases, over an hour
    # on one runner. Split them by spec file and bound each private build and shard.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron needs a display + the usual Chromium shared libs. xvfb-run
      # supplies a virtual X server; playwright's dep installer pulls the libs.
      # WebKit backs the mobile Safari checks in contextual-help and
      # mobile-composer-layout.
      - name: Install system deps for headless Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pnpm exec playwright install --with-deps chromium webkit

      # ubuntu-24.04 blocks Chromium's sandbox via AppArmor; Electron never
      # creates a window without this (microsoft/playwright#34251).
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build and test affected Electron boundaries
        run: xvfb-run -a node scripts/ci-verification.mjs
        env:
          CI_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          NODE_OPTIONS: --max-old-space-size=6144
          CI_E2E_SHARD: ${{ matrix.shard }}/3

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            e2e/.artifacts
          retention-days: 7
          if-no-files-found: ignore

  # Preserve the existing required check name while making every job load-bearing.
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    needs: [unit, unit-packages, coverage, e2e, connect-postgres]
    if: always()
    steps:
      - name: Require unit and production-boundary verification
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          PACKAGES_RESULT: ${{ needs.unit-packages.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          BOUNDARY_RESULT: ${{ needs.e2e.result }}
          POSTGRES_RESULT: ${{ needs.connect-postgres.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$PACKAGES_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$BOUNDARY_RESULT" = success
          test "$POSTGRES_RESULT" = success
