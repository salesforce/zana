name: CI

# Gate every change that targets main: typecheck + unit tests must pass before
# a PR can merge. release.yml re-runs the same gate on tag pushes, but this is
# the one wired into branch protection (a required status check on main).

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Manual trigger — used to run the E2E job on demand (it is gated to
  # workflow_dispatch only; see the e2e job below).
  workflow_dispatch: {}

# A new push to a PR cancels the previous run for that PR — no point burning
# minutes on a commit that's already superseded. main pushes use the ref so they
# don't cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # node-pty / better-sqlite3 are native; pnpm runs their install
      # scripts. distutils was dropped from Python 3.12 stdlib, so pin 3.11
      # where node-gyp can still import it (matches release.yml).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test

  # E2E (Playwright + real Electron) is informational, NOT a required check —
  # it launches the whole app under a headless X server (xvfb) and exercises the
  # marketplace install path against a signed local HTTPS registry. Kept off the
  # branch-protection gate (which is `verify` only) so an E2E flake never blocks
  # a merge; promote it to required once it has proven stable over many runs.
  #
  # It builds the whole app (Monaco et al.) then runs real-Electron Playwright,
  # which takes far longer than the `verify` unit job — so it does NOT run on
  # every PR/push. It is gated to manual `workflow_dispatch` (Actions tab -> CI
  # -> Run workflow) and can also be run locally with `pnpm run test:e2e:only`.
  e2e:
    name: E2E (Playwright + Electron)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    # Don't fail the overall workflow on an E2E flake while it bakes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron needs a display + the usual Chromium shared libs. xvfb-run
      # supplies a virtual X server; playwright's dep installer pulls the libs.
      - name: Install system deps for headless Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npx playwright install-deps chromium

      # ubuntu-24.04 blocks Chromium's sandbox via AppArmor; Electron never
      # creates a window without this (microsoft/playwright#34251).
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build app
        run: pnpm run build
        env:
          # The renderer bundle includes Monaco and exceeds Node's default heap
          # on GitHub-hosted runners.
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Rebuild native modules for Electron
        run: pnpm run rebuild:electron

      - name: E2E tests
        run: xvfb-run -a pnpm run test:e2e:only

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            e2e/.artifacts
          retention-days: 7
          if-no-files-found: ignore
