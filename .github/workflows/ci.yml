name: CI

# Gate every change that targets main: typecheck + unit tests must pass before
# a PR can merge. release.yml re-runs the same gate on tag pushes, but this is
# the one wired into branch protection (a required status check on main).

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Manual trigger also runs the same required verification jobs.
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Optional comparison base for the full unpublished branch range'
        required: false
        type: string

# A new push to a PR cancels the previous run for that PR — no point burning
# minutes on a commit that's already superseded. main pushes use the ref so they
# don't cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # node-pty / better-sqlite3 are native; pnpm runs their install
      # scripts. distutils was dropped from Python 3.12 stdlib, so pin 3.11
      # where node-gyp can still import it (matches release.yml).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # The diagram tests exercise the same local asset shipped in the plugin.
      # A clean unit-test checkout has not run the production plugin build.
      - name: Prepare Slack runtime assets
        run: pnpm --filter zcc-plugin-slack-bridge-2ff2 package

      - name: Install Chrome for Slack diagram tests
        run: pnpm --dir plugins/slack-bridge-2ff2 exec puppeteer browsers install chrome

      # The real Chromium diagram test needs the same sandbox support as Electron.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Unit tests with coverage
        run: pnpm exec vitest run --coverage --coverage.reportOnFailure --coverage.reporter=json --coverage.reportsDirectory=coverage/root

      - name: Tasks tests with package configuration and coverage
        run: pnpm exec vitest run --config plugins/tasks/vitest.config.ts --coverage --coverage.reportOnFailure --coverage.reporter=json --coverage.reportsDirectory="$GITHUB_WORKSPACE/coverage/tasks"

      - name: Pi provider tests with package configuration and coverage
        run: pnpm --dir plugins/provider-pi exec vitest run --config vitest.config.ts --coverage --coverage.reportOnFailure --coverage.reporter=json --coverage.reportsDirectory="$GITHUB_WORKSPACE/coverage/pi"

      - name: Release package coverage
        run: pnpm exec vitest run --config vitest.release-coverage.config.ts --coverage --coverage.reportOnFailure --coverage.reporter=json --coverage.reportsDirectory=coverage/release

      - name: Enforce changed-code coverage
        run: node scripts/ci-verification.mjs --coverage coverage/root/coverage-final.json coverage/tasks/coverage-final.json coverage/pi/coverage-final.json coverage/release/coverage-final.json
        env:
          CI_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}

      - name: Upload coverage reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: coverage/*/coverage-final.json
          retention-days: 7
          if-no-files-found: ignore

  # Every affected seam is exercised in the built app; failures fail CI.
  # Keep model-spending live attach suites outside unattended CI.
  e2e:
    name: Affected Electron boundaries
    runs-on: ubuntu-latest
    # Broad release branches select 81 production-boundary cases; the first
    # 50 took 31 minutes in CI. Bound the private build and complete suite.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron needs a display + the usual Chromium shared libs. xvfb-run
      # supplies a virtual X server; playwright's dep installer pulls the libs.
      - name: Install system deps for headless Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pnpm exec playwright install --with-deps chromium

      # ubuntu-24.04 blocks Chromium's sandbox via AppArmor; Electron never
      # creates a window without this (microsoft/playwright#34251).
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build and test affected Electron boundaries
        run: xvfb-run -a node scripts/ci-verification.mjs
        env:
          CI_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            e2e/.artifacts
          retention-days: 7
          if-no-files-found: ignore

  # Preserve the existing required check name while making both jobs load-bearing.
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    if: always()
    steps:
      - name: Require unit and production-boundary verification
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          BOUNDARY_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$BOUNDARY_RESULT" = success
