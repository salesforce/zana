name: Release

# Build and publish a macOS release when a version tag is pushed.
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# node-pty is a native module, so each architecture is built on a runner of
# that architecture (no reliable cross-compile): macos-13 = Intel/x64,
# macos-14 = Apple Silicon/arm64. Both .dmg artifacts attach to one Release.
#
# The app is signed with an Apple Developer ID certificate and notarized so that
# electron-updater can auto-update one build to the next — Squirrel.Mac refuses
# to update an unsigned app. The signing cert is imported from the CSC_LINK +
# CSC_KEY_PASSWORD repo secrets; notarization requires APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID (see docs/auto-update-setup.md).
# With Developer ID + notarization, fresh installs open without Gatekeeper prompts.

on:
  push:
    tags:
      - 'v*'
  # Allow a manual dry run (builds artifacts, does not create a Release).
  workflow_dispatch:

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fail early if the tagged version has no curated release notes — the
      # "What's New" modal bundles docs/releases/<version>.md, so a release
      # can't ship without it (see scripts/check-release-notes.mjs).
      - run: pnpm run check:release-notes
      - run: pnpm run typecheck
      - run: pnpm test

  # Release gate: boot the BUILT app under headless Electron and confirm it
  # launches + its main↔renderer IPC round-trips (e2e/smoke.spec.ts). Unlike
  # ci.yml's informational e2e job, this one is REQUIRED — `build` needs it, so
  # a build that can't even boot never reaches signing/notarization/publish.
  # Only the single smoke spec runs (test:smoke:only), not the heavier
  # marketplace/registry specs, so the gate stays fast and stable.
  smoke:
    name: Smoke (boots + IPC)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # node-pty / better-sqlite3 are native; pnpm runs their install scripts.
      # distutils was dropped from Python 3.12 stdlib, so pin 3.11 (matches ci.yml).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron needs a display + Chromium shared libs; xvfb-run supplies a
      # virtual X server and playwright's installer pulls the libs.
      - name: Install system deps for headless Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npx playwright install-deps chromium

      - name: Build app
        run: pnpm run build
        env:
          # The renderer bundle (monaco) blows past Node's default heap during
          # electron-vite build; raise it (matches the build job below).
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Smoke test (boot + IPC round-trip)
        run: xvfb-run -a pnpm run test:smoke:only

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-playwright-report
          path: |
            playwright-report
            e2e/.artifacts
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build (${{ matrix.arch }})
    needs: [verify, smoke]
    strategy:
      fail-fast: false
      matrix:
        include:
          # node-pty can't cross-compile, so each arch is built on a runner of
          # that arch: macos-14 = Apple Silicon/arm64, macos-13 = Intel/x64.
          # Both artifacts attach to one Release; latest-mac.yml lists both so
          # electron-updater serves the right build per machine.
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # electron-builder rebuilds node-pty via node-gyp, which still imports
      # Python's distutils. The runner default (Python 3.12+) removed distutils
      # from the stdlib, so pin 3.11 where it still ships.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package
        # electron-builder rebuilds node-pty for the bundled Electron's ABI
        # automatically (npmRebuild defaults to true). Build only this runner's
        # arch so the native binary matches.
        #
        # Signing + notarization: when CSC_LINK is present electron-builder imports
        # the cert (Developer ID Application) and signs (required for
        # electron-updater/Squirrel.Mac auto-update). When the secret is ABSENT,
        # `${{ secrets.CSC_LINK }}` expands to "" — and electron-builder would
        # treat the empty string as a cert FILE PATH and die ("<repo> not a file").
        # So we only export the CSC_* + APPLE_* vars when the secret is non-empty,
        # and otherwise set CSC_IDENTITY_AUTO_DISCOVERY=false to build a clean
        # UNSIGNED app (no auto-update for that build).
        #
        # Notarization requires APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD (app-specific
        # password from appleid.apple.com), and APPLE_TEAM_ID. electron-builder
        # 25.x reads these directly when notarize: true is set in electron-builder.yml.
        # Fail-fast if signing is enabled but any notarization secret is missing.
        # For unsigned builds, pass --config.mac.notarize=false to override the
        # config's notarize: true (electron-builder 25.x CLI flag overrides config).
        run: |
          pnpm run build
          if [ -n "$CSC_LINK_SECRET" ]; then
            # Fail-fast: signing enabled but missing notarization secrets
            : "${APPLE_ID_SECRET:?ERROR: CSC_LINK is set but APPLE_ID secret is missing. Add all 5 secrets (see docs/auto-update-setup.md).}"
            : "${APPLE_APP_SPECIFIC_PASSWORD_SECRET:?ERROR: CSC_LINK is set but APPLE_APP_SPECIFIC_PASSWORD secret is missing.}"
            : "${APPLE_TEAM_ID_SECRET:?ERROR: CSC_LINK is set but APPLE_TEAM_ID secret is missing.}"
            echo "Signing + notarization enabled (all secrets present)."
            export CSC_LINK="$CSC_LINK_SECRET"
            export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_SECRET"
            export APPLE_ID="$APPLE_ID_SECRET"
            export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD_SECRET"
            export APPLE_TEAM_ID="$APPLE_TEAM_ID_SECRET"
            pnpm exec electron-builder --mac --${{ matrix.arch }} --publish never
          else
            echo "No signing cert — building UNSIGNED (auto-update disabled, notarization disabled)."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # Override config's notarize: true for unsigned builds (would fail without Apple secrets)
            pnpm exec electron-builder --mac --${{ matrix.arch }} --publish never --config.mac.notarize=false
          fi
        env:
          # The renderer bundle pulls in the heavy monaco-vscode packages, which
          # blow past Node's default ~2 GB heap during `electron-vite build`
          # (FATAL: JavaScript heap out of memory). Raise the limit; macos
          # runners have >=7 GB RAM.
          NODE_OPTIONS: --max-old-space-size=6144
          # Passed in under *_SECRET names; the script promotes them to the real
          # env vars only when non-empty (see above). To enable signed +
          # notarized auto-updating builds, add these repo secrets per
          # docs/auto-update-setup.md:
          #   CSC_LINK                      = base64 of the Developer ID Application .p12 export
          #   CSC_KEY_PASSWORD              = the .p12 export password
          #   APPLE_ID                      = your Apple ID email (e.g., dev@example.com)
          #   APPLE_APP_SPECIFIC_PASSWORD   = app-specific password from appleid.apple.com
          #   APPLE_TEAM_ID                 = 10-character team ID from developer.apple.com
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          # dmg = first install; zip + latest-mac.yml = the auto-update feed
          # electron-updater reads. blockmaps enable differential downloads.
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    # Only publish a Release for tag pushes, not manual dry runs.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Keep the published feed aligned with electron-builder.yml
          # (owner: salesforce, repo: zana). Publish into this repository
          # with the workflow GITHUB_TOKEN — no cross-repo release token.
          # dmg + zip + blockmap + latest-mac.yml must all be attached:
          # electron-updater reads latest-mac.yml to detect a new version and
          # downloads the zip (the dmg is for first-install only).
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.blockmap
            artifacts/latest-mac.yml
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ### Zana Command Center ${{ github.ref_name }}

            macOS builds (Apple Silicon + Intel), signed with Developer ID and
            notarized. First launch should open without Gatekeeper prompts.
            Auto-updates install on quit.

            After you update, the app opens **What's New** with the curated notes
            for this version (the same `docs/releases` markdown bundled in the app).

            > **Note:** if this build is unsigned (no signing secrets configured),
            > auto-update is disabled and you will need to bypass Gatekeeper manually:
            > **System Settings → Privacy & Security → Open Anyway**, or run
            > `xattr -dr com.apple.quarantine` on the app. Once signing + notarization
            > secrets are configured (see `docs/auto-update-setup.md`), builds will be
            > fully notarized and auto-update seamlessly.

            | Mac | Download |
            | --- | --- |
            | Apple Silicon (M-series) | `*-arm64.dmg` |
            | Intel | `*-x64.dmg` |
