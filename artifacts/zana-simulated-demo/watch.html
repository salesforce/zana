<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zana — product walkthrough</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f6;color:#344a67;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1400px;margin:32px auto;padding:0 26px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}h1{font-size:24px;font-weight:600;margin:0}p{color:#8b9bb0;font-size:14px}video{width:100%;display:block;border-radius:12px;box-shadow:0 12px 55px #3a51731c;background:#e4eaf3}nav{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}button,a{border:1px solid #cbd8e8;border-radius:7px;background:#fff;color:#637fa3;padding:10px 13px;font-size:13px;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#e6eef9}footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:18px}footer p{line-height:1.6}button:focus-visible,a:focus-visible{outline:3px solid #84aef0;outline-offset:3px}
</style>
<main>
  <header><h1>Zana · Product walkthrough</h1><p>3:10 · Narrated · 1080p</p></header>
  <video id="video" src="Zana-simulated-demo.mp4" poster="thumbnail.jpg" controls preload="metadata" playsinline></video>
  <nav aria-label="Chapters"><button data-time="0">Welcome</button><button data-time="7">Create a project</button><button data-time="23">Launch an agent</button><button data-time="46">Monitor work</button><button data-time="85">GUS tickets</button><button data-time="119">Create a plugin</button></nav>
  <footer><p>A scripted replica with fictional projects, agents and tickets.<br>All cursor movement is rendered inside the demo.</p><a href="index.html" id="interactive">Try the interactive demo ↗</a></footer>
</main>
<script>document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-time]');if(b){const v=document.getElementById('video');v.currentTime=Number(b.dataset.time);v.play().catch(()=>{});}});</script>
</html>
